spring.application.name=api-crm

# Configuracion del servidor web embebido Tomcat 11
server.port=8080

# Conexion JDBC a MySQL (Base de datos: altair, Esquema predeterminado: crm)
spring.datasource.url=jdbc:mysql://localhost:3306/crm_altair?currentSchema=crm
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Conexion JDBC a PostgreSQL (Base de datos: altair, Esquema predeterminado: crm)
#spring.datasource.url=jdbc:postgresql://localhost:5432/altair?currentSchema=crm
#spring.datasource.username=postgres
#spring.datasource.password=FPr0f3s0r.m3
#spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate (Jakarta Persistence)
spring.jpa.properties.hibernate.default_schema=crm
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true